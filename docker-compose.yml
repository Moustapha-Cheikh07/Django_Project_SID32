services:
  web:
    build: .
    volumes:
      - ./ansade:/app
    ports:
      - "23007:23007"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql://django:Medmouna@db:3306/Inpc_db
    networks:
      - mynetwork

  db:
    image: mysql:8.0
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=Inpc_db
      - MYSQL_USER=django
      - MYSQL_PASSWORD=Medmouna
      - MYSQL_ROOT_PASSWORD=RootMedmouna
    ports:
      - "24007:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mynetwork

volumes:
  mysql_data:

networks:
  mynetwork: