{% extends 'inpc/base.html' %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">{% if form.instance.pk %}Modifier{% else %}Ajouter{% endif %} une Moughata</h1>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="{{ form.code.id_for_label }}" class="form-label">Code</label>
            {{ form.code }}
        </div>
        <div class="mb-3">
            <label for="{{ form.label.id_for_label }}" class="form-label">Label</label>
            {{ form.label }}
        </div>
        <div class="mb-3">
            <label for="{{ form.wilaya.id_for_label }}" class="form-label">Wilaya</label>
            {{ form.wilaya }}
        </div>
        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a href="{% url 'moughata_list' %}" class="btn btn-secondary">Annuler</a>
    </form>
</div>
{% endblock %}
