{% extends 'inpc/base.html' %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">{% if form.instance.pk %}Modifier{% else %}Ajouter{% endif %} un Prix de Produit</h1>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="{{ form.product.id_for_label }}" class="form-label">Produit</label>
            {{ form.product }}
        </div>
        <div class="mb-3">
            <label for="{{ form.point_of_sale.id_for_label }}" class="form-label">Point de Vente</label>
            {{ form.point_of_sale }}
        </div>
        <div class="mb-3">
            <label for="{{ form.value.id_for_label }}" class="form-label">Valeur</label>
            {{ form.value }}
        </div>
        <div class="mb-3">
            <label for="{{ form.date_from.id_for_label }}" class="form-label">Date de début</label>
            {{ form.date_from }}
        </div>
        <div class="mb-3">
            <label for="{{ form.date_to.id_for_label }}" class="form-label">Date de fin</label>
            {{ form.date_to }}
        </div>
        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a href="{% url 'product_price_list' %}" class="btn btn-secondary">Annuler</a>
    </form>
</div>
{% endblock %}
