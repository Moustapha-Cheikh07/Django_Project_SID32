{% extends 'inpc/base.html' %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">Paniers</h1>
    <a href="{% url 'cart_create' %}" class="btn btn-primary mb-3">
        <i class="fas fa-plus"></i> Ajouter un Panier
    </a>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Code</th>
                <th>Nom</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for cart in carts %}
            <tr>
                <td>{{ cart.code }}</td>
                <td>{{ cart.name }}</td>
                <td>{{ cart.description|truncatewords:10 }}</td>
                <td>
                    <a href="{% url 'cart_update' cart.id %}" class="btn btn-sm btn-warning">
                        <i class="fas fa-edit"></i> Modifier
                    </a>
                    <a href="{% url 'cart_delete' cart.id %}" class="btn btn-sm btn-danger">
                        <i class="fas fa-trash"></i> Supprimer
                    </a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">Aucun panier trouvé.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
