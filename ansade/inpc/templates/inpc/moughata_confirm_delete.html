{% extends 'inpc/base.html' %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">Supprimer la Moughata</h1>
    <p>Êtes-vous sûr de vouloir supprimer la moughata "{{ object.label }}" ?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirmer la suppression</button>
        <a href="{% url 'moughata_list' %}" class="btn btn-secondary">Annuler</a>
    </form>
</div>
{% endblock %}
