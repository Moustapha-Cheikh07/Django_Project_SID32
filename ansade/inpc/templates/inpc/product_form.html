{% extends 'inpc/base.html' %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">{% if form.instance.pk %}Modifier{% else %}Ajouter{% endif %} un Produit</h1>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="{{ form.code.id_for_label }}" class="form-label">Code</label>
            {{ form.code }}
        </div>
        <div class="mb-3">
            <label for="{{ form.name.id_for_label }}" class="form-label">Nom</label>
            {{ form.name }}
        </div>
        <div class="mb-3">
            <label for="{{ form.description.id_for_label }}" class="form-label">Description</label>
            {{ form.description }}
        </div>
        <div class="mb-3">
            <label for="{{ form.unit_measure.id_for_label }}" class="form-label">Unité de mesure</label>
            {{ form.unit_measure }}
        </div>
        <div class="mb-3">
            <label for="{{ form.product_type.id_for_label }}" class="form-label">Type de produit</label>
            {{ form.product_type }}
        </div>
        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a href="{% url 'product_list' %}" class="btn btn-secondary">Annuler</a>
    </form>
</div>
{% endblock %}
