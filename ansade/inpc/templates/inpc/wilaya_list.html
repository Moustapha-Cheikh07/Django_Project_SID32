{% extends 'inpc/base.html' %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">
            <i class="fas fa-map me-2"></i>Wilayas
        </h1>
        <a href="{% url 'wilaya_create' %}" class="btn btn-primary">
            <i class="fas fa-plus me-2"></i>Ajouter une Wilaya
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Code</th>
                            <th>Nom</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for wilaya in wilayas %}
                        <tr>
                            <td>{{ wilaya.code }}</td>
                            <td>{{ wilaya.name }}</td>
                            <td class="text-end">
                                <a href="{% url 'wilaya_update' wilaya.id %}" class="btn btn-sm btn-warning me-1">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <a href="{% url 'wilaya_delete' wilaya.id %}" class="btn btn-sm btn-danger delete-btn">
                                    <i class="fas fa-trash"></i>
                                </a>
                            </td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="3" class="text-center py-4">
                                <div class="text-muted">
                                    <i class="fas fa-map fa-3x mb-3"></i>
                                    <p class="mb-0">Aucune wilaya trouvée.</p>
                                </div>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
