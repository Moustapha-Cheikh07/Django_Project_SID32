{% extends 'inpc/base.html' %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6">
            <div class="card">
                <div class="card-header bg-danger text-white py-3">
                    <h1 class="h3 mb-0">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        Confirmer la suppression
                    </h1>
                </div>
                <div class="card-body">
                    <p class="mb-0">Êtes-vous sûr de vouloir supprimer le prix du produit "{{ object.product.name }}" pour le point de vente "{{ object.point_of_sale.name }}" ?</p>
                    <p class="text-danger mb-0"><strong>Cette action est irréversible.</strong></p>
                </div>
                <div class="card-footer bg-light">
                    <form method="post" class="d-flex justify-content-end gap-2">
                        {% csrf_token %}
                        <a href="{% url 'product_price_list' %}" class="btn btn-light">
                            <i class="fas fa-times me-2"></i>Annuler
                        </a>
                        <button type="submit" class="btn btn-danger">
                            <i class="fas fa-trash me-2"></i>Supprimer
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
