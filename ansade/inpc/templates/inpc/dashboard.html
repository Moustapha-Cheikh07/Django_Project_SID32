{% extends "inpc/base.html" %}

{% block title %}Dashboard - INPC{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <h1 class="mb-4">Dashboard INPC</h1>

    <div class="row">
        <div class="col-md-6 mb-4">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0">Évolution de l'INPC par Produit</h5>
                </div>
                <div class="card-body">
                    <select id="productSelect" class="form-select mb-3">
                        <option value="">Sélectionnez un produit</option>
                        {% for product in products %}
                            <option value="{{ product.id }}">{{ product.name }}</option>
                        {% endfor %}
                    </select>
                    <div class="chart-container">
                        <canvas id="productINPCBarChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-6 mb-4">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0">Évolution de l'INPC Global</h5>
                </div>
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-md-3">
                            <label for="startDate" class="form-label">Date de début</label>
                            <input type="date" id="startDate" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label for="endDate" class="form-label">Date de fin</label>
                            <input type="date" id="endDate" class="form-control">
                        </div>
                        <div class="col-md-3 d-flex align-items-end">
                            <button id="updateGlobalINPC" class="btn btn-primary">Mettre à jour</button>
                        </div>
                    </div>
                    <div class="chart-container">
                        <canvas id="globalINPCChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    let productINPCBarChart, globalINPCChart;

    function initProductINPCBarChart() {
        const ctx = document.getElementById('productINPCBarChart').getContext('2d');
        productINPCBarChart = new Chart(ctx, {
            type: 'bar', // Changement en graphe en barre
            data: {
                labels: [],
                datasets: [{
                    label: 'INPC',
                    data: [],
                    backgroundColor: 'rgba(75, 192, 192, 0.6)',
                    borderColor: 'rgb(75, 192, 192)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    }

    function updateProductINPCBarChart(productId) {
        fetch(`/dashboard/product-inpc-chart/?product=${productId}`)
            .then(response => response.json())
            .then(data => {
                productINPCBarChart.data.labels = data.labels;
                productINPCBarChart.data.datasets[0].data = data.datasets[0].data;
                productINPCBarChart.update();
            });
    }

    function initGlobalINPCChart() {
        const ctx = document.getElementById('globalINPCChart').getContext('2d');
        globalINPCChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'INPC Global',
                    data: [],
                    borderColor: 'rgb(255, 99, 132)',
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: false
                    }
                }
            }
        });
    }

    function updateGlobalINPCChart() {
        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;
        fetch(`/dashboard/global-inpc-chart/?start_date=${startDate}&end_date=${endDate}`)
            .then(response => response.json())
            .then(data => {
                globalINPCChart.data.labels = data.labels;
                globalINPCChart.data.datasets[0].data = data.datasets[0].data;
                globalINPCChart.update();
            });
    }

    document.addEventListener('DOMContentLoaded', function() {
        initProductINPCBarChart();
        initGlobalINPCChart();

        const productSelect = document.getElementById('productSelect');
        productSelect.addEventListener('change', function() {
            if (this.value) {
                updateProductINPCBarChart(this.value);
            }
        });

        const updateGlobalINPCButton = document.getElementById('updateGlobalINPC');
        updateGlobalINPCButton.addEventListener('click', updateGlobalINPCChart);

        // Default dates for global INPC chart
        const today = new Date();
        const oneMonthAgo = new Date(today.getFullYear(), today.getMonth() - 1, today.getDate());
        document.getElementById('startDate').value = oneMonthAgo.toISOString().split('T')[0];
        document.getElementById('endDate').value = today.toISOString().split('T')[0];

        updateGlobalINPCChart();
    });
</script>
{% endblock %}
