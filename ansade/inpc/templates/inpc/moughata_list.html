{% extends 'inpc/base.html' %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">Moughatas</h1>
    <a href="{% url 'moughata_create' %}" class="btn btn-primary mb-3">
        <i class="fas fa-plus"></i> Ajouter une Moughata
    </a>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Code</th>
                <th>Label</th>
                <th>Wilaya</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for moughata in moughatas %}
            <tr>
                <td>{{ moughata.code }}</td>
                <td>{{ moughata.label }}</td>
                <td>{{ moughata.wilaya.name }}</td>
                <td>
                    <a href="{% url 'moughata_update' moughata.id %}" class="btn btn-sm btn-warning">
                        <i class="fas fa-edit"></i> Modifier
                    </a>
                    <a href="{% url 'moughata_delete' moughata.id %}" class="btn btn-sm btn-danger">
                        <i class="fas fa-trash"></i> Supprimer
                    </a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">Aucune moughata trouvée.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
