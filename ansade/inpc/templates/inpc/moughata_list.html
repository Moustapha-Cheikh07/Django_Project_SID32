{% extends 'inpc/base.html' %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">
            <i class="fas fa-map-marked-alt me-2"></i>Moughatas
        </h1>
        <a href="{% url 'moughata_create' %}" class="btn btn-primary">
            <i class="fas fa-plus me-2"></i>Ajouter une Moughata
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Code</th>
                            <th>Label</th>
                            <th>Wilaya</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for moughata in moughatas %}
                        <tr>
                            <td>{{ moughata.code }}</td>
                            <td>{{ moughata.label }}</td>
                            <td>{{ moughata.wilaya.name }}</td>
                            <td class="text-end">
                                <a href="{% url 'moughata_update' moughata.id %}" class="btn btn-sm btn-warning me-1">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <a href="{% url 'moughata_delete' moughata.id %}" class="btn btn-sm btn-danger delete-btn">
                                    <i class="fas fa-trash"></i>
                                </a>
                            </td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="4" class="text-center py-4">
                                <div class="text-muted">
                                    <i class="fas fa-map-marked-alt fa-3x mb-3"></i>
                                    <p class="mb-0">Aucune moughata trouvée.</p>
                                </div>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
